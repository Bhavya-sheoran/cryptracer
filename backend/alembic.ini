# Alembic configuration.
#
# The database URL is deliberately NOT set here. env.py reads it from
# app.config, so there is exactly one place a connection string is defined and
# no chance of migrations running against a different database than the app.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Zero-padded numeric prefix plus a slug: migrations then sort in apply order
# in a directory listing, which a bare hash does not.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
