# Root-level lint config.
#
# `backend/pyproject.toml` already configures ruff, but ruff resolves config by
# walking up from each file - so `backend/app/...` found it while `scripts/`
# and `ml/src/` walked to the repo root, found nothing, and were checked with
# ruff's defaults instead (a different rule set and a different line length).
#
# That meant "ruff passes" depended on which directory you invoked it from,
# which is exactly the kind of difference that shows up first as a red CI run
# nobody can reproduce locally. This file makes the answer the same everywhere.
#
# Keep these values in sync with backend/pyproject.toml [tool.ruff]; that file
# still wins for anything under backend/, being the nearer config.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in default arguments. Depends(get_db) is the
# documented FastAPI dependency-injection idiom, so it is excluded rather than
# worked around.
ignore = ["B008"]
