# SIH26183 - Fraud-Linked Exchange Identification - local/demo stack.
# Compose v2.20+ / v5.x : the top-level `version:` key is obsolete and omitted.
#
# HOST PORTS: this project deliberately uses a non-default host port block
# (5434 / 7475 / 7688 / 6380 / 8001 / 5174) so it can run side by side with
# another local stack holding the conventional ports. Container-internal ports
# are unchanged. Override any of them in .env.
name: sih183

services:
  postgres:
    image: postgres:16-alpine
    container_name: sih183-postgres
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sihdev}
      POSTGRES_DB: sih183
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/002_exposure.sql:/docker-entrypoint-initdb.d/02-exposure.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih183"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    container_name: sih183-neo4j
    # The official image runs its server as root by default. Its own `neo4j`
    # user (7474) already owns /data and /logs, so pinning it here costs
    # nothing and means a compromise of the database process is not a
    # compromise of root.
    user: "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-sihdevpass}
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"   # HTTP / Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7688}:7687"   # Bolt
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
      # NOTE: infra/neo4j is NOT mounted here. The Neo4j entrypoint chowns its
      # import dir, which fails on a read-only bind mount. The constraints in
      # init.cypher are applied by the backend at startup instead, so the file
      # is mounted into the backend container below.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      # Loading the GDS + APOC plugins takes ~85s on a cold start; a shorter
      # start_period makes compose declare the service unhealthy before Neo4j
      # has bound its HTTP listener.
      start_period: 150s

  redis:
    image: redis:7-alpine
    container_name: sih183-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: sih183-backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sih:${POSTGRES_PASSWORD:-sihdev}@postgres:5432/sih183
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sihdevpass}
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      # These must be forwarded explicitly. The backend's WORKDIR is /app,
      # which is ./backend - so pydantic-settings reads backend/.env, never the
      # root .env. Without these lines, setting JWT_SECRET in the root .env
      # documented by .env.example would silently do nothing, which is the
      # worst possible outcome for a security knob.
      JWT_SECRET: ${JWT_SECRET:-insecure-demo-secret-replace-before-any-real-deployment}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      # This compose file IS the demo stack, so the published demo accounts
      # default on here. They are still force-disabled the moment DEMO_MODE is
      # false, and the setting itself defaults to false in app/config.py - so a
      # deployment that does not use this file gets the safe behaviour.
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      RATE_LIMIT_AUTH_FAILURES: ${RATE_LIMIT_AUTH_FAILURES:-8}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-300}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      BLOCKCHAIR_API_KEY: ${BLOCKCHAIR_API_KEY:-}
      TRACE_MAX_DEPTH: ${TRACE_MAX_DEPTH:-8}
      TRACE_MAX_BREADTH: ${TRACE_MAX_BREADTH:-25}
      RISK_DECAY_HALF_LIFE_DAYS: ${RISK_DECAY_HALF_LIFE_DAYS:-90}
      RISK_MEDIUM_THRESHOLD: ${RISK_MEDIUM_THRESHOLD:-40}
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-70}
      # Lets ml/src/*.py import the app package when run via `compose exec`.
      PYTHONPATH: /app
      # uvicorn --reload watches via `watchfiles`, which relies on OS-level
      # filesystem events. Those do not cross a Windows bind mount into the
      # Linux VM, so edits on the host were never seen and the container kept
      # serving stale code. Polling is slower but actually works here.
      WATCHFILES_FORCE_POLLING: "true"
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
    ports:
      # Bound to the loopback interface, not 0.0.0.0. This is the plaintext
      # route: reachable for local development and for scripts/, but not from
      # the network, so it cannot be used to sidestep Caddy's TLS from another
      # machine. Removed entirely by docker-compose.prod.yml.
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - ./ml/artifacts:/app/ml_artifacts:ro
      # Writable: scripts/generate_synthetic_complaints.py emits the dataset here.
      - ./ml/seeds:/app/ml_seeds
      - ./infra/neo4j:/app/infra/neo4j:ro
      - ./infra/postgres:/app/infra/postgres:ro
      - ./scripts:/app/scripts:ro
      # Whole ml/ tree: src (seed + train scripts), data, artifacts, seeds.
      - ./ml:/app/ml
      - backendstorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: sih183-frontend
    environment:
      # Empty means same-origin: the dashboard calls /api/v1/... relatively.
      # Direct access on 5174 works because Vite proxies /api to the backend
      # (see vite.config.js); access through Caddy on 8443 works because Caddy
      # does. One code path, no CORS either way, and https is inherited rather
      # than hardcoded.
      VITE_API_BASE: ""
      VITE_WS_URL: ""
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  # TLS front door. Serves the dashboard and the API from one https origin, so
  # tokens and complaint data never cross the wire in cleartext.
  #
  # The direct http ports on backend and frontend above are kept for local
  # development convenience. A real deployment removes them and publishes only
  # this service - otherwise the plaintext route is still open beside the
  # encrypted one, which makes the encryption optional in practice.
  caddy:
    image: caddy:2-alpine
    container_name: sih183-caddy
    restart: unless-stopped
    # Non-root, like the other services we control. Nothing here needs
    # privilege: 8443 is above the reserved range, and the local CA lives in
    # the caddydata volume, which is chowned to this uid below.
    user: "1000:1000"
    # Every capability dropped except the one the caddy binary carries as a
    # file capability. Dropping that too makes exec itself fail with EPERM -
    # the kernel refuses to run a binary whose permitted file caps are outside
    # the bounding set - so it is granted back rather than fought.
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data      # the local CA and issued certificates
      - caddyconfig:/config
    depends_on:
      - backend
      - frontend

  # Training-only image. Behind a profile so `docker compose up` never starts it:
  # it exists to be `run`, and it carries PyTorch (~1.9 GB) which the API must
  # not. Bring it up explicitly:
  #   docker compose run --rm ml python ml/src/train_gnn.py
  ml:
    profiles: ["ml"]
    build:
      context: ./ml
    container_name: sih183-ml
    working_dir: /repo
    volumes:
      - ./ml:/repo/ml
      - ./scripts:/repo/scripts:ro
    command: ["python", "ml/src/train_gnn.py"]

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  redisdata:
  backendstorage:
  caddydata:
  caddyconfig:
